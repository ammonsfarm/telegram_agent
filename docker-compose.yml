services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: telegram_agent
      POSTGRES_USER: telegram_agent
      POSTGRES_PASSWORD: change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  telegram-agent:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - /srv/workspaces:/workspaces:rw
    restart: unless-stopped

volumes:
  postgres_data:
